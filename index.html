<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Healthgists — Health News, Tips & Insights. Coming Soon.</title>
    <meta
      name="description"
      content="Healthgists is your trusted destination for health news, medical insights, wellness tips, and expert health publications. Launching soon — sign up to be notified."
    />
    <meta
      name="keywords"
      content="health news, medical insights, wellness tips, health blog, health publications, healthcare, nutrition, mental health, fitness"
    />
    <meta name="author" content="Healthgists" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://healthgists.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://healthgists.com/" />
    <meta
      property="og:title"
      content="Healthgists — Health News, Tips & Insights. Coming Soon."
    />
    <meta
      property="og:description"
      content="Your trusted destination for health news, medical insights, wellness tips, and expert health publications. Launching soon."
    />
    <meta property="og:image" content="https://healthgists.com/og-image.png" />
    <meta property="og:site_name" content="Healthgists" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@healthgists" />
    <meta name="twitter:creator" content="@healthgists" />
    <meta
      name="twitter:title"
      content="Healthgists — Health News, Tips & Insights. Coming Soon."
    />
    <meta
      name="twitter:description"
      content="Your trusted destination for health news, medical insights, wellness tips, and expert health publications. Launching soon."
    />
    <meta name="twitter:image" content="https://healthgists.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon-white.svg" />
    <link rel="apple-touch-icon" href="/logo-main.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0d4a3a" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Healthgists",
        "url": "https://healthgists.com",
        "description": "Your trusted destination for health news, medical insights, wellness tips, and expert health publications.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://healthgists.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
