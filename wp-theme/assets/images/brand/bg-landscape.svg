<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d4f0"/>
      <stop offset="45%" stop-color="#5aafe8"/>
      <stop offset="100%" stop-color="#1E89E3"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6e2e"/>
      <stop offset="100%" stop-color="#1a4a1b"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#337D34"/>
      <stop offset="100%" stop-color="#1e5220"/>
    </linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8f3e"/>
      <stop offset="100%" stop-color="#245825"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a1b"/>
      <stop offset="100%" stop-color="#0d2e0e"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f0b" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#0a1f0b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#061409" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#030d05" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <!-- Cloud 1 -->
    <ellipse cx="200" cy="130" rx="110" ry="38" fill="white" opacity="0.9" filter="url(#blur1)"/>
    <ellipse cx="270" cy="115" rx="75" ry="32" fill="white" opacity="0.95" filter="url(#blur1)"/>
    <ellipse cx="140" cy="118" rx="60" ry="28" fill="white" opacity="0.8" filter="url(#blur1)"/>

    <!-- Cloud 2 -->
    <ellipse cx="780" cy="90" rx="130" ry="42" fill="white" opacity="0.85" filter="url(#blur1)"/>
    <ellipse cx="860" cy="72" rx="85" ry="35" fill="white" opacity="0.9" filter="url(#blur1)"/>
    <ellipse cx="700" cy="82" rx="70" ry="30" fill="white" opacity="0.75" filter="url(#blur1)"/>

    <!-- Cloud 3 -->
    <ellipse cx="1250" cy="110" rx="100" ry="35" fill="white" opacity="0.8" filter="url(#blur1)"/>
    <ellipse cx="1320" cy="95" rx="65" ry="28" fill="white" opacity="0.85" filter="url(#blur1)"/>

    <!-- Cloud 4 (small) -->
    <ellipse cx="480" cy="160" rx="70" ry="24" fill="white" opacity="0.6" filter="url(#blur1)"/>
    <ellipse cx="540" cy="148" rx="50" ry="20" fill="white" opacity="0.65" filter="url(#blur1)"/>

    <!-- Cloud 5 -->
    <ellipse cx="1050" cy="140" rx="90" ry="30" fill="white" opacity="0.7" filter="url(#blur1)"/>
  </g>

  <!-- Far mountains (background layer) -->
  <path d="M-10 480 L80 310 L200 380 L340 260 L480 340 L600 200 L720 310 L840 230 L960 300 L1080 180 L1200 280 L1340 200 L1450 290 L1450 900 L-10 900 Z"
        fill="url(#mtn1)" opacity="0.6" filter="url(#blur2)"/>

  <!-- Mid mountains -->
  <path d="M-10 560 L60 420 L160 490 L280 370 L420 460 L540 330 L660 430 L800 350 L940 450 L1060 310 L1180 410 L1300 340 L1440 430 L1440 900 L-10 900 Z"
        fill="url(#mtn2)" opacity="0.8"/>

  <!-- Closer hills -->
  <path d="M-10 640 L80 530 L200 590 L360 490 L500 570 L640 480 L760 560 L900 490 L1040 560 L1160 500 L1300 570 L1440 510 L1440 900 L-10 900 Z"
        fill="url(#mtn3)"/>

  <!-- Foreground trees / dark base -->
  <path d="M-10 720 Q180 680 360 710 Q540 740 720 700 Q900 660 1080 690 Q1260 720 1440 695 L1440 900 L-10 900 Z"
        fill="url(#fg)"/>

  <!-- Tree silhouettes on foreground left -->
  <g fill="#0d2e0e" opacity="0.9">
    <polygon points="30,720 55,640 80,720"/>
    <polygon points="60,720 88,630 116,720"/>
    <polygon points="90,720 120,645 150,720"/>
    <polygon points="10,720 35,660 60,720"/>
    <polygon points="120,720 145,650 170,720"/>
    <polygon points="150,720 178,638 206,720"/>
    <polygon points="0,720 25,675 50,720"/>
  </g>

  <!-- Tree silhouettes on foreground right -->
  <g fill="#0d2e0e" opacity="0.9">
    <polygon points="1260,720 1285,635 1310,720"/>
    <polygon points="1290,720 1318,628 1346,720"/>
    <polygon points="1320,720 1348,642 1376,720"/>
    <polygon points="1350,720 1380,650 1410,720"/>
    <polygon points="1380,720 1408,638 1436,720"/>
    <polygon points="1410,720 1435,660 1450,720"/>
  </g>

  <!-- Small tree details mid -->
  <g fill="#1a4a1b" opacity="0.6">
    <polygon points="580,700 600,650 620,700"/>
    <polygon points="800,695 822,645 844,695"/>
    <polygon points="640,700 660,655 680,700"/>
  </g>

  <!-- Overlay for text readability -->
  <rect width="1440" height="900" fill="url(#overlay)"/>

  <!-- Subtle vignette edges -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#010a02" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1440" height="900" fill="url(#vignette)"/>
</svg>
