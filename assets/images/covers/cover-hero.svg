<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="basehero" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a2a1c"/><stop offset="45%" stop-color="#12578e"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient>
    <filter id="blurhero" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="shadowhero" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
