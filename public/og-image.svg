<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2e10"/>
      <stop offset="50%" stop-color="#0f3d16"/>
      <stop offset="100%" stop-color="#061a09"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#337d34" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#337d34" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e89e3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e89e3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#337d34" stop-opacity="0"/>
      <stop offset="50%" stop-color="#337d34" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#337d34" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative arcs top-right -->
  <circle cx="1100" cy="-80" r="380" fill="none" stroke="url(#arc1)" stroke-width="1.5"/>
  <circle cx="1120" cy="-60" r="460" fill="none" stroke="url(#arc1)" stroke-width="1"/>
  <circle cx="1080" cy="-100" r="300" fill="none" stroke="url(#arc2)" stroke-width="1"/>

  <!-- Decorative arcs bottom-left -->
  <circle cx="100" cy="730" r="340" fill="none" stroke="url(#arc1)" stroke-width="1.2"/>
  <circle cx="80" cy="750" r="420" fill="none" stroke="url(#arc1)" stroke-width="0.8"/>

  <!-- Horizontal shine band -->
  <rect x="0" y="270" width="1200" height="90" fill="url(#shine)"/>

  <!-- Dot grid pattern top-right -->
  <g opacity="0.12">
    <circle cx="900" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="940" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="980" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="1020" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="1060" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="1100" cy="60" r="2" fill="#f5f7fa"/>
    <circle cx="900" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="940" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="980" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="1020" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="1060" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="1100" cy="100" r="2" fill="#f5f7fa"/>
    <circle cx="900" cy="140" r="2" fill="#f5f7fa"/>
    <circle cx="940" cy="140" r="2" fill="#f5f7fa"/>
    <circle cx="980" cy="140" r="2" fill="#f5f7fa"/>
    <circle cx="1020" cy="140" r="2" fill="#f5f7fa"/>
    <circle cx="1060" cy="140" r="2" fill="#f5f7fa"/>
    <circle cx="1100" cy="140" r="2" fill="#f5f7fa"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="200" width="4" height="230" rx="2" fill="#337d34" opacity="0.7"/>

  <!-- COMING SOON badge -->
  <rect x="100" y="190" width="160" height="30" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <rect x="100" y="190" width="160" height="30" rx="15" fill="rgba(0,0,0,0.3)"/>
  <circle cx="122" cy="205" r="4" fill="#f9a825"/>
  <text x="136" y="210" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="2" opacity="0.95">COMING SOON</text>

  <!-- Main headline -->
  <text x="100" y="295" font-family="Montserrat, Arial, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1.5">Your Trusted Source</text>
  <text x="100" y="368" font-family="Montserrat, Arial, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1.5">for <tspan fill="#f9a825">Health News</tspan></text>
  <text x="100" y="441" font-family="Montserrat, Arial, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-1.5">&amp; Expert Insights.</text>

  <!-- Subtext -->
  <text x="100" y="496" font-family="Georgia, serif" font-size="20" font-weight="400" fill="rgba(245,247,250,0.72)" font-style="italic">Evidence-based health articles, wellness tips, and medical news.</text>

  <!-- Divider -->
  <line x1="100" y1="526" x2="400" y2="526" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- URL -->
  <text x="100" y="556" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(245,247,250,0.5)" letter-spacing="0.5">healthgists.com</text>

  <!-- Right side: logo mark -->
  <!-- HG speech bubble icon (simplified geometric version) -->
  <g transform="translate(870, 200)" opacity="0.15">
    <circle cx="130" cy="130" r="130" fill="#337d34"/>
    <text x="130" y="165" font-family="Montserrat, Arial, sans-serif" font-size="100" font-weight="800" fill="white" text-anchor="middle">HG</text>
  </g>

  <!-- Right side logo text -->
  <g transform="translate(870, 200)" opacity="0.9" filter="url(#softglow)">
    <!-- Speech bubble icon outline -->
    <path d="M80 60 Q80 30 110 30 L220 30 Q250 30 250 60 L250 110 Q250 140 220 140 L140 140 L110 165 L118 140 L110 140 Q80 140 80 110 Z" fill="none" stroke="#337d34" stroke-width="3"/>
    <!-- H inside bubble -->
    <text x="130" y="108" font-family="Montserrat, Arial, sans-serif" font-size="52" font-weight="800" fill="#f5f7fa" text-anchor="middle" letter-spacing="-2">HG</text>
  </g>

  <!-- HealthGists wordmark -->
  <g transform="translate(862, 380)">
    <text font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="#f5f7fa">
      <tspan>Health</tspan><tspan font-style="italic" fill="#f9a825">Gists</tspan>
    </text>
  </g>

  <!-- Bottom green strip -->
  <rect x="0" y="606" width="1200" height="4" fill="#337d34" opacity="0.8"/>
  <rect x="0" y="610" width="1200" height="20" fill="rgba(0,0,0,0.4)"/>

  <!-- Bottom tagline -->
  <text x="600" y="624" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(245,247,250,0.4)" text-anchor="middle" letter-spacing="1">HEALTH NEWS · WELLNESS TIPS · MEDICAL INSIGHTS</text>
</svg>
